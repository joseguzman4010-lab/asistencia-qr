<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesor - 2026B Seguridad Acceso Redes Públicas</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 850px; margin: 0 auto; text-align: center; }
    .header { border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
    .materia { color: #0056b3; margin: 0; }
    button { padding: 12px 18px; font-size: 0.95rem; background-color: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .btn-exito { background-color: #28a745; }
    .btn-descargar { background-color: #17a2b8; }
    .btn-salir { background-color: #dc3545; }
    #scannerBox { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #0056b3; border-radius: 10px; overflow: hidden; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .tag-valido { color: #155724; background-color: #d4edda; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .tag-sospechoso { color: #721c24; background-color: #f8d7da; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    #alertaRespuesta { margin-top: 15px; font-size: 1.1rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2 class="materia">2026B - Seguridad Acceso Redes Públicas</h2>
    <h3 style="margin-top: 5px; color: #444;">Panel del Profesor</h3>
  </div>

  <div>
    <button class="btn-exito" onclick="iniciarEscaner()">📷 Abrir Escáner de Cámara</button>
    <button onclick="cargarLista()">🔄 Actualizar Lista</button>
    <button class="btn-descargar" onclick="descargarCSV()">📥 Descargar Excel (CSV)</button>
    <button class="btn-salir" onclick="cerrarSesion()">🔒 Salir</button>
  </div>

  <div id="scannerBox">
    <div id="reader"></div>
  </div>

  <div id="alertaRespuesta"></div>

  <h3>Registro de Asistencias</h3>
  <table>
    <thead>
      <tr>
        <th>Folio</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Código</th>
        <th>Fecha y Hora (CDMX)</th>
        <th>Estado Dispositivo</th>
      </tr>
    </thead>
    <tbody id="tablaAsistencias"></tbody>
  </table>

  <script>
    let html5QrcodeScanner = null;
    let procesandoScan = false;

    function obtenerPassword() {
      let pass = sessionStorage.getItem('adminPass');
      if (!pass) {
        pass = prompt('Ingresa la contraseña de profesor:');
        if (pass) sessionStorage.setItem('adminPass', pass);
      }
      return pass;
    }

    function manejarErrorAuth(res) {
      if (res.status === 401) {
        alert('Contraseña incorrecta.');
        sessionStorage.removeItem('adminPass');
        location.reload();
        return true;
      }
      return false;
    }

    function iniciarEscaner() {
      const pass = obtenerPassword();
      if (!pass) return;

      document.getElementById('scannerBox').style.display = 'block';

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess, onScanError);
      }
    }

    async function onScanSuccess(decodedText) {
      if (procesandoScan) return;
      procesandoScan = true;

      const pass = obtenerPassword();
      const divAlerta = document.getElementById('alertaRespuesta');

      try {
        const payloadData = JSON.parse(decodedText);

        const res = await fetch('/api/registrar-por-profesor', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': pass
          },
          body: JSON.stringify(payloadData)
        });

        if (manejarErrorAuth(res)) {
          procesandoScan = false;
          return;
        }

        const data = await res.json();

        if (res.ok) {
          divAlerta.style.color = '#155724';
          divAlerta.innerHTML = `✅ ¡${data.mensaje}!`;
          cargarLista();
        } else {
          divAlerta.style.color = '#721c24';
          divAlerta.innerHTML = `❌ Error: ${data.error}`;
        }
      } catch (err) {
        divAlerta.style.color = '#721c24';
        divAlerta.innerHTML = `❌ El código QR escaneado no tiene un formato válido.`;
      }

      setTimeout(() => {
        procesandoScan = false;
      }, 2500);
    }

    function onScanError(errorMessage) {
      // Ignorar errores continuos de búsqueda de QR
    }

    async function cargarLista() {
      const pass = obtenerPassword();
      if (!pass) return;

      const res = await fetch('/api/asistencias', {
        headers: { 'x-admin-password': pass }
      });

      if (manejarErrorAuth(res)) return;

      const datos = await res.json();
      const tbody = document.getElementById('tablaAsistencias');
      tbody.innerHTML = '';

      datos.forEach(item => {
        const tr = document.createElement('tr');
        const badgeEstado = item.sospechoso 
          ? `<span class="tag-sospechoso">⚠️ Sospechoso (Mismo Celular)</span>`
          : `<span class="tag-valido">✅ Válido</span>`;

        tr.innerHTML = `
          <td><code>${item.folio}</code></td>
          <td>${item.primerNombre}</td>
          <td>${item.primerApellido}</td>
          <td>${item.codigoAlumno}</td>
          <td>${item.fecha}</td>
          <td>${badgeEstado}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function descargarCSV() {
      const pass = obtenerPassword();
      if (!pass) return;

      const res = await fetch('/api/asistencias', {
        headers: { 'x-admin-password': pass }
      });

      if (manejarErrorAuth(res)) return;

      const datos = await res.json();

      if (!datos || datos.length === 0) {
        alert('No hay asistencias registradas para descargar.');
        return;
      }

      let csvContent = "\uFEFF";
      csvContent += "Folio,Primer Nombre,Primer Apellido,Código de Alumno,Fecha y Hora (CDMX),Estado Dispositivo,Device ID\n";

      datos.forEach(row => {
        const estadoTexto = row.sospechoso ? "SOSPECHOSO (MISMO CELULAR)" : "VALIDO";
        const fila = [
          `"${row.folio}"`,
          `"${row.primerNombre}"`,
          `"${row.primerApellido}"`,
          `"${row.codigoAlumno}"`,
          `"${row.fecha}"`,
          `"${estadoTexto}"`,
          `"${row.deviceId}"`
        ].join(",");
        csvContent += fila + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Asistencias_2026B_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function cerrarSesion() {
      sessionStorage.removeItem('adminPass');
      alert('Sesión cerrada.');
      location.reload();
    }

    cargarLista();
  </script>
</body>
</html>
