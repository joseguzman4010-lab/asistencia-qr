<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyector QR Dinámico - CUSUR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .qr-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      max-width: 520px;
      width: 90%;
    }
    #qrcode {
      min-height: 312px;
    }
    #qrcode img, #qrcode canvas {
      margin: 0 auto;
      border: 16px solid #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .badge-live {
      background-color: #10b981;
      color: #042f2e;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #042f2e;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <div class="mb-3">
      <span class="badge-live">
        <span class="pulse-dot"></span> CÓDIGO ANTI-TRAMPAS ACTIVO (3s)
      </span>
    </div>

    <h3 class="fw-bold text-primary mb-1" id="nombreMateria">Control de Asistencia</h3>
    <p class="text-slate-300 fs-6 mb-3">Escanea directamente con la App Móvil</p>
    
    <div id="qrcode" class="d-flex justify-content-center align-items-center mb-3"></div>

    <p class="small text-muted mb-1">Sesión Dinámica:</p>
    <code class="text-info fs-6 fw-bold" id="urlTexto">Generando...</code>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const claseId = params.get('claseId') || 'REDES-2026B';
    const materia = params.get('materia') || 'Asistencia CUSUR';

    document.getElementById('nombreMateria').innerText = materia;

    const baseUrl = window.location.origin;
    const qrContainer = document.getElementById("qrcode");

    function actualizarQR() {
      // Generar ID de sesión único basado en tiempo
      const sessionId = 'SESION-' + Date.now();
      const urlAlumno = `${baseUrl}/alumno.html?claseId=${encodeURIComponent(claseId)}&materia=${encodeURIComponent(materia)}&sessionId=${sessionId}`;

      // Limpiar QR anterior
      qrContainer.innerHTML = "";

      // Generar nuevo QR
      new QRCode(qrContainer, {
        text: urlAlumno,
        width: 280,
        height: 280,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById('urlTexto').innerText = sessionId;
    }

    // Primera ejecución
    actualizarQR();

    // Actualización automática cada 3000 ms (3 segundos)
    setInterval(actualizarQR, 3000);
  </script>
</body>
</html>
