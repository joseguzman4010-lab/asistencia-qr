<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia - 2026B Seguridad Acceso Redes Públicas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 15px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 12px;
    }
    .materia {
      color: #0056b3;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 0 6px 0;
    }
    .titulo {
      color: #1c1e21;
      font-size: 1.4rem;
      margin: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #4b4f56;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #0056b3;
    }
    button {
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    #resultado {
      margin-top: 20px;
      text-align: center;
    }
    .exito {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      padding: 12px;
      border-radius: 8px;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <p class="materia">2026B - Seguridad Acceso Redes Públicas</p>
      <h1 class="titulo">Registro de Asistencia</h1>
    </div>

    <form id="formAsistencia">
      <div class="form-group">
        <label for="primerNombre">Primer Nombre:</label>
        <input type="text" id="primerNombre" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo caracteres alfabéticos" placeholder="Ej. Juan">
      </div>

      <div class="form-group">
        <label for="primerApellido">Primer Apellido:</label>
        <input type="text" id="primerApellido" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo caracteres alfabéticos" placeholder="Ej. Pérez">
      </div>

      <div class="form-group">
        <label for="codigoAlumno">Código de Alumno (9 dígitos):</label>
        <input type="text" id="codigoAlumno" required pattern="\d{9}" maxlength="9" minlength="9" title="Exactamente 9 números" placeholder="Ej. 219876543">
      </div>

      <!-- Token tomado de la URL -->
      <input type="hidden" id="token">

      <button type="submit">Registrar Asistencia</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tokenURL = urlParams.get('token');
    if (tokenURL) {
      document.getElementById('token').value = tokenURL;
    }

    document.getElementById('formAsistencia').addEventListener('submit', async (e) => {
      e.preventDefault();

      const tokenInput = document.getElementById('token').value || prompt('Ingresa el Token activo:');

      if (!tokenInput) {
        alert('El token es obligatorio.');
        return;
      }

      const payload = {
        primerNombre: document.getElementById('primerNombre').value.trim(),
        primerApellido: document.getElementById('primerApellido').value.trim(),
        codigoAlumno: document.getElementById('codigoAlumno').value.trim(),
        token: tokenInput
      };

      try {
        const res = await fetch('/api/registrar-asistencia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const divRes = document.getElementById('resultado');

        if (res.ok) {
          divRes.className = 'exito';
          divRes.innerHTML = `
            <p><strong>${data.mensaje}</strong></p>
            <p style="margin:0;">Folio inmutable: <code>${data.comprobante.folio}</code></p>
          `;
          document.getElementById('formAsistencia').reset();
        } else {
          divRes.className = 'error';
          divRes.innerHTML = `<p><strong>Error:</strong> ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('resultado').className = 'error';
        document.getElementById('resultado').innerHTML = `<p>Error de conexión con el servidor.</p>`;
      }
    });
  </script>
</body>
</html>
