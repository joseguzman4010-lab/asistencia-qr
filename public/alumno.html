<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia - 2026B Seguridad Acceso Redes Públicas</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 15px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .header {
      border-bottom: 2px solid #0056b3;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .materia {
      color: #0056b3;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 0 6px 0;
    }
    .titulo {
      color: #1c1e21;
      font-size: 1.4rem;
      margin: 0;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #4b4f56;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    button {
      width: 100%;
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    #qrContainer {
      margin-top: 20px;
      display: none;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 2px dashed #0056b3;
    }
    #timerBar {
      color: #d9534f;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <p class="materia">2026B - Seguridad Acceso Redes Públicas</p>
      <h1 class="titulo">Mi Pase de Asistencia</h1>
    </div>

    <form id="formAlumno" novalidate>
      <div class="form-group">
        <label for="primerNombre">Primer Nombre:</label>
        <input type="text" id="primerNombre" placeholder="Ej. Juan">
      </div>

      <div class="form-group">
        <label for="primerApellido">Primer Apellido:</label>
        <input type="text" id="primerApellido" placeholder="Ej. Pérez">
      </div>

      <div class="form-group">
        <label for="codigoAlumno">Código de Alumno (9 dígitos):</label>
        <input type="text" id="codigoAlumno" placeholder="Ej. 219876543">
      </div>

      <button type="submit" id="btnActivar">Generar QR Dinámico</button>
    </form>

    <div id="qrContainer">
      <h3 style="margin: 0 0 10px 0; color: #333;">Muestra este QR al Profesor</h3>
      <canvas id="qrCanvas"></canvas>
      <div id="timerBar">Renovando en 5s...</div>
    </div>
  </div>

  <script>
    function obtenerDeviceId() {
      let deviceId = localStorage.getItem('device_uuid');
      if (!deviceId) {
        deviceId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
        localStorage.setItem('device_uuid', deviceId);
      }
      return deviceId;
    }

    const regexSoloLetras = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
    const regexSoloNumeros = /^\d+$/;

    let intervaloQR = null;
    let contadorSegundos = 5;

    document.getElementById('formAlumno').addEventListener('submit', (e) => {
      e.preventDefault();

      const nombre = document.getElementById('primerNombre').value.trim();
      const apellido = document.getElementById('primerApellido').value.trim();
      const codigo = document.getElementById('codigoAlumno').value.trim();

      if (!nombre || !apellido || !codigo) {
        alert('Por favor, completa todos los campos.');
        return;
      }

      if (!regexSoloLetras.test(nombre) || !regexSoloLetras.test(apellido)) {
        alert('Nombre y apellido solo deben contener letras.');
        return;
      }

      if (!regexSoloNumeros.test(codigo) || codigo.length !== 9) {
        alert('El código debe tener exactamente 9 dígitos numéricos.');
        return;
      }

      // Mostrar el contenedor del QR
      document.getElementById('qrContainer').style.display = 'block';
      
      // Iniciar generación continua del QR dinámico
      actualizarQR(nombre, apellido, codigo);
      
      if (intervaloQR) clearInterval(intervaloQR);

      contadorSegundos = 5;
      intervaloQR = setInterval(() => {
        contadorSegundos--;
        if (contadorSegundos <= 0) {
          actualizarQR(nombre, apellido, codigo);
          contadorSegundos = 5;
        }
        document.getElementById('timerBar').innerText = `Renovando en ${contadorSegundos}s...`;
      }, 1000);
    });

    function actualizarQR(nombre, apellido, codigo) {
      const payload = {
        primerNombre: nombre,
        primerApellido: apellido,
        codigoAlumno: codigo,
        deviceId: obtenerDeviceId(),
        timestamp: Date.now(),
        nonce: Math.random().toString(36).substring(2, 10).toUpperCase()
      };

      QRCode.toCanvas(document.getElementById('qrCanvas'), JSON.stringify(payload), { width: 220 }, function (err) {
        if (err) console.error(err);
      });
    }
  </script>
</body>
</html>
