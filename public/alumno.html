<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Alumno - CUSUR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { font-size: 22px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 15px; }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn { width: 100%; padding: 14px; background-color: #16a34a; border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn:disabled { background-color: #475569; cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 15px; text-align: center; display: none; }
    .alert-success { background-color: #14532d; color: #4ade80; border: 1px solid #16a34a; }
    .alert-warning { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .materia-badge { background: #334155; padding: 6px 12px; border-radius: 20px; text-align: center; font-size: 12px; color: #38bdf8; font-weight: 600; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Pase de Asistencia CUSUR</h1>
    <p class="sub">Confirma tus datos para registrar asistencia</p>

    <div id="materiaInfo" class="materia-badge">Cargando clase...</div>

    <form id="asistenciaForm">
      <div class="form-group">
        <label for="codigo">Código del Alumno (9 dígitos):</label>
        <input type="number" id="codigo" placeholder="Ej. 222940104" required>
      </div>

      <div class="form-group">
        <label for="nombre">Primer Nombre:</label>
        <input type="text" id="nombre" placeholder="Ej. Jose" required>
      </div>

      <div class="form-group">
        <label for="apellido">Primer Apellido:</label>
        <input type="text" id="apellido" placeholder="Ej. Avalos">
      </div>

      <button type="submit" id="btnEnviar" class="btn">✅ Confirmar Asistencia</button>
    </form>

    <div id="alertBox" class="alert"></div>
  </div>

  <script>
    function obtenerDeviceId() {
      let devId = localStorage.getItem('cusur_device_hardware_id');
      if (!devId) {
        devId = 'WEB-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('cusur_device_hardware_id', devId);
      }
      return devId;
    }

    window.onload = () => {
      const savedCodigo = localStorage.getItem('cusur_student_codigo');
      const savedNombre = localStorage.getItem('cusur_student_nombre');
      const savedApellido = localStorage.getItem('cusur_student_apellido');

      if (savedCodigo) document.getElementById('codigo').value = savedCodigo;
      if (savedNombre) document.getElementById('nombre').value = savedNombre;
      if (savedApellido) document.getElementById('apellido').value = savedApellido;

      const urlParams = new URLSearchParams(window.location.search);
      const materia = urlParams.get('materia') || 'Clase General';
      document.getElementById('materiaInfo').innerText = `📚 ${materia}`;
    };

    document.getElementById('asistenciaForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnEnviar');
      const alertBox = document.getElementById('alertBox');
      const codigo = document.getElementById('codigo').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();

      const urlParams = new URLSearchParams(window.location.search);
      const claseId = urlParams.get('claseId') || 'REDES-2026B';
      const materia = urlParams.get('materia') || 'General';
      const sessionId = urlParams.get('sessionId') || 'CLASE-ACTIVA';

      if (!codigo || !nombre) {
        alert("El código y nombre son obligatorios.");
        return;
      }

      localStorage.setItem('cusur_student_codigo', codigo);
      localStorage.setItem('cusur_student_nombre', nombre);
      localStorage.setItem('cusur_student_apellido', apellido);

      btn.disabled = true;
      btn.innerText = "Registrando...";
      alertBox.style.display = "none";

      try {
        const response = await fetch('/api/asistencia', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true' // <--- Bypass de pantalla de Ngrok
          },
          body: JSON.stringify({
            claseId,
            materia,
            codigoAlumno: codigo,
            primerNombre: nombre,
            primerApellido: apellido,
            deviceId: obtenerDeviceId(),
            sessionId,
            timestamp: Date.now()
          })
        });

        const data = await response.json();
        alertBox.style.display = "block";

        if (response.ok && data.success) {
          if (data.message.includes('Advertencia') || data.message.includes('Sospechoso')) {
            alertBox.className = "alert alert-warning";
          } else {
            alertBox.className = "alert alert-success";
          }
          alertBox.innerText = data.message;
        } else {
          alertBox.className = "alert alert-warning";
          alertBox.innerText = data.message || "No se pudo registrar la asistencia.";
        }
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.className = "alert alert-warning";
        alertBox.innerText = "Error de conexión con el servidor.";
      } finally {
        btn.disabled = false;
        btn.innerText = "✅ Confirmar Asistencia";
      }
    });
  </script>
</body>
</html>
