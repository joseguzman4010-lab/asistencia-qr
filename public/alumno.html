<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Asistencia - Alumno</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 text-center">
        <h1 class="text-xl font-bold text-indigo-400 mb-1">Pase de Asistencia</h1>
        <p class="text-xs text-slate-400 mb-6">Muestra este código a tu profesor</p>

        <!-- SECCIÓN 1: Primer Registro (Solo aparece si el dispositivo no está vinculado) -->
        <div id="setupSection" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Ingresa tu Código de Estudiante:</label>
                <input type="text" id="inputCodigo" placeholder="Ej: 2026001" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-center font-mono text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <button onclick="registrarDispositivo()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold py-2.5 rounded-xl transition shadow-lg">
                🔒 Vincular Dispositivo
            </button>
            <p class="text-[11px] text-amber-400/90 bg-amber-950/40 border border-amber-800/40 p-2.5 rounded-lg text-left">
                ⚠️ <b>Seguridad Anti-Fraude:</b> Una vez vinculado, este celular quedará asignado únicamente a tu código.
            </p>
        </div>

        <!-- SECCIÓN 2: Pase Activo (Aparece automáticamente cuando el celular ya está vinculado) -->
        <div id="activeSection" class="hidden space-y-4">
            <!-- Badge de Identificación -->
            <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs">
                <span class="text-slate-400">Estudiante:</span>
                <span id="displayCodigo" class="font-mono font-bold text-indigo-400 text-sm"></span>
            </div>

            <!-- Contenedor del QR Dinámico -->
            <div class="bg-white p-4 rounded-xl flex justify-center items-center shadow-inner min-h-[220px]">
                <div id="qrcode"></div>
            </div>

            <!-- Contador de seguridad de 15 segundos -->
            <div class="space-y-1">
                <div class="flex justify-between text-[11px] text-slate-400">
                    <span>Auto-renovación de seguridad</span>
                    <span id="timerText" class="font-bold text-indigo-400">15s</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-1.5 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-500 h-1.5 transition-all duration-1000 w-full"></div>
                </div>
            </div>

            <!-- Opción para pruebas de desarrollo -->
            <button onclick="desvincularDispositivo()" 
                    class="text-[11px] text-slate-500 hover:text-rose-400 underline transition pt-2">
                Desvincular Dispositivo (Modo Pruebas)
            </button>
        </div>
    </div>

    <script>
        let intervalId = null;
        let timerId = null;
        let tiempoRestante = 15;

        function obtenerCodigoGuardado() {
            return localStorage.getItem('codigoEstudiante');
        }

        function registrarDispositivo() {
            const inputVal = document.getElementById('inputCodigo').value.trim();
            if (!inputVal) {
                alert("Por favor ingresa un código de estudiante válido.");
                return;
            }
            // Guarda el código de forma permanente en el navegador del teléfono
            localStorage.setItem('codigoEstudiante', inputVal);
            iniciarPase();
        }

        function desvincularDispositivo() {
            if (confirm("¿Seguro que deseas desvincular este dispositivo?")) {
                localStorage.removeItem('codigoEstudiante');
                clearInterval(intervalId);
                clearInterval(timerId);
                document.getElementById('setupSection').classList.remove('hidden');
                document.getElementById('activeSection').classList.add('hidden');
                document.getElementById('inputCodigo').value = '';
            }
        }

        async function generarQR() {
            const codigo = obtenerCodigoGuardado();
            if (!codigo) return;

            try {
                const res = await fetch(`/generar-qr/${codigo}`);
                const data = await res.json();

                if (data.success) {
                    const qrContainer = document.getElementById('qrcode');
                    qrContainer.innerHTML = '';
                    new QRCode(qrContainer, {
                        text: data.token,
                        width: 190,
                        height: 190,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    reiniciarTemporizador();
                }
            } catch (e) {
                console.error("Error al generar QR:", e);
            }
        }

        function reiniciarTemporizador() {
            tiempoRestante = 15;
            const timerText = document.getElementById('timerText');
            const progressBar = document.getElementById('progressBar');

            timerText.innerText = `${tiempoRestante}s`;
            progressBar.style.width = '100%';

            if (timerId) clearInterval(timerId);

            timerId = setInterval(() => {
                tiempoRestante--;
                timerText.innerText = `${tiempoRestante}s`;
                progressBar.style.width = `${(tiempoRestante / 15) * 100}%`;

                if (tiempoRestante <= 0) {
                    clearInterval(timerId);
                }
            }, 1000);
        }

        function iniciarPase() {
            const codigo = obtenerCodigoGuardado();
            if (!codigo) return;

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('activeSection').classList.remove('hidden');
            document.getElementById('displayCodigo').innerText = codigo;

            generarQR();
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(generarQR, 15000);
        }

        // Al abrir la página, verificar si el teléfono ya fue registrado previamente
        window.onload = () => {
            if (obtenerCodigoGuardado()) {
                iniciarPase();
            }
        };
    </script>
</body>
</html>
